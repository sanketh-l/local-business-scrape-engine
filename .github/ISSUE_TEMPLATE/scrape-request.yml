name: Scrape Request
description: Form-style dashboard. Submit this and GitHub Actions will start automatically.
title: "Scrape request"
labels: ["scrape-request"]
body:
  - type: markdown
    attributes:
      value: |
        Fill this like a Google Form. Leave area blank to scan the full city by discovered areas.

        Start with dry-run first. A dry-run creates the area list and queue but does not create business leads.

  - type: input
    id: city
    attributes:
      label: City
      placeholder: Bengaluru
    validations:
      required: true

  - type: input
    id: country
    attributes:
      label: Country
      placeholder: India
    validations:
      required: true

  - type: input
    id: area
    attributes:
      label: Area/neighborhood optional
      description: Leave blank for the full city. Example if needed: Nandini Layout.
      placeholder: Leave blank for full city
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - plumber
        - electrician
        - roofing contractor
        - HVAC contractor
        - house cleaning service
        - pest control service
        - tree service
        - landscaper
        - painting contractor
        - bathroom remodeler
        - kitchen remodeler
        - flooring contractor
        - fence contractor
        - deck builder
        - concrete contractor
        - garage door repair
        - handyman
        - commercial cleaning service
        - auto repair shop
        - dentist
    validations:
      required: true

  - type: dropdown
    id: coverage
    attributes:
      label: Coverage intensity
      options:
        - Street-level, many small squares
        - Balanced
        - Fast preview
    validations:
      required: true

  - type: input
    id: max_areas
    attributes:
      label: Max areas to queue
      description: For full-city runs. Start with 20-50. Increase after validation.
      placeholder: "50"
    validations:
      required: true

  - type: input
    id: worker_limit
    attributes:
      label: Worker task limit this run
      description: Number of grid-square tasks to execute in this Actions run. Start with 1.
      placeholder: "1"
    validations:
      required: true

  - type: dropdown
    id: real_scrape
    attributes:
      label: Run real scrape?
      description: Choose No for dry-run. Dry-run does not create business leads.
      options:
        - "No, dry-run only"
        - "Yes, run real scrape"
    validations:
      required: true

  - type: dropdown
    id: compliance
    attributes:
      label: Legal/compliance acknowledgement
      description: Required for real scraping.
      options:
        - "No"
        - "I_ACCEPT_LEGAL_RISK"
    validations:
      required: true
